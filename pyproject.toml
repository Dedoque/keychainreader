[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "keychainreader"
version = "0.1.0"
description = "MCP server for macOS Keychain and Linux Secret Service interactions"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.0.0",
    "keyring>=25.0.0",
    "pyperclip>=1.9.0",
]

[project.scripts]
keychainreader = "keychainreader.server:main"

[tool.hatch.build.targets.wheel]
packages = ["keychainreader"]

